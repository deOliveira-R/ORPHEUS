# Nexus project configuration — read by the Sphinx extension, the CLI and
# the MCP server alike. Precedence: explicit flag > this file > conf.py >
# built-in default.
#
# ⚠ TRANSITION (2026-08-15). `output = "graph"` still writes BESIDE the
# pre-config graph at `docs/_build/html/_nexus/` rather than over it, so the
# two remain comparable. `_nexus/` is now FROZEN — no build writes there —
# and should be deleted once the transition is closed, or it becomes a stale
# graph someone points a tool at.
#
# `docs/conf.py`'s `nexus_*` options were RETIRED once the config-driven
# graph was proven byte-for-byte equivalent (0 symmetric difference across
# node ids, node rows, edge multiset, node attrs and edge attrs, on
# 24307 nodes / 215226 edges).

[graph]
# During the transition this is "graph", not "_nexus", so the config-driven
# build lands beside the conf.py-driven one instead of replacing it. It also
# removes the one-character collision between `.nexus/` (this directory,
# tracked, an input) and `_nexus/` (build output, gitignored, derived).
output = "graph"

# Where the CLI and the MCP server should look. They cannot derive it: the
# artefacts land under the Sphinx output directory, which only the build
# knows. The build warns if it writes somewhere else.
db = "docs/_build/html/graph/graph.db"

# `infer_implements` is deliberately LEFT AT ITS DEFAULT (true), measured
# 2026-08-15 rather than assumed. Turning it off is surgical — `[M]` it
# changes ONLY `implements` edges (13968), zero node difference — but it is
# not free:
#
#   inference ON : 13968 implements, of which 13968 inferred, 0 declared
#   inference OFF: 0
#   equations with a code link: 632 of 903  →  0 of 903
#
# ORPHEUS has never authored a single `.. implements::`, so switching it off
# trades a NOISY code↔maths surface for NO code↔maths surface. The inference
# is genuinely weak (87.5 % of edges rest on a single shared token, at
# confidence 0.7) — but the defect that makes it dangerous is downstream:
# consumers do not filter on `confidence`. `verification_coverage` reports
# status="verified" whenever any test edge exists, with no floor.
#
# ⟹ the fix belongs in the CONSUMER (a confidence floor) and in AUTHORING
# (declare `.. implements::`, which lands at 1.0 and suppresses inference for
# that pair), not in this switch. Revisit once declared coverage is real.

# tests/ is analysed, so test functions are first-class graph nodes. This is
# why tests/ docstrings become Nexus nodes while NOT being autodoc pages.
extra_source_dirs = ["tests"]

# Both directories mint placeholder nodes that bare references elsewhere then
# bind to. The rationale, moved here from docs/conf.py when it was retired:
#
#   student_resources/ holds pedagogical re-implementations whose class names
#   intentionally shadow orpheus.* (CPParams, CPResult, TwoGroupXS,
#   HomogeneousResult, MCParams, FuelBehaviourResult, KineticsResult).
#   Without the exclusion, Sphinx's py-domain xref resolver attaches BOTH the
#   orpheus.* class and the tutorial duplicate to every api/*.rst page —
#   inflating the graph and triggering false staleness flags whenever a
#   tutorial file is touched.
#
#   scratch/ is the prototyping bench: throwaway probes and archived
#   diagnostics kept for the record but which are not the codebase. Several
#   still import module paths retired long ago
#   (orpheus.derivations.peierls_geometry), which minted 850 scratch.* nodes
#   and a family of placeholder targets that bare :func:` ` roles on theory
#   pages then suffix-matched onto — reporting LIVE symbols as dead
#   references. Prototypes should not define the graph's namespace.
exclude_patterns = ["student_resources/*", "scratch/*"]

[scope]
# Path prefixes considered in-scope for runtime ingestion. A LIST, because no
# single prefix works: profiling the suite produces tests → orpheus edges, and
# either directory alone drops one endpoint of every one of them, while the
# repository root sweeps in .venv.
#
# ⚠ Consumed by nexus once multi-prefix `--source-prefix` lands
# (deOliveira-R/sphinxcontrib-nexus#56). Stated here now so the value has one
# home rather than being retyped per invocation.
prefixes = ["orpheus", "tests"]

[catalog]
# The L0 error catalogue. Unblocks `err:ERR-NNN` nodes and a real `catches`
# edge (deOliveira-R/sphinxcontrib-nexus#63); `nexus gaps` currently reports
# `error_catalog_size: None` because nothing tells it where this lives.
errors = ".claude/skills/vv-principles/error_catalog.md"
