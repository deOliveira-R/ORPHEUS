[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orpheus"
version = "0.1.0"
description = "Open Reactor Physics Educational University System"
# Floor raised 3.11 → 3.13 for native PEP-696 TypeVar defaults (the
# two-param ``LinearOperator[Din, Cout]`` split, #65 / P4.5): the
# ``Cout = TypeVar("Cout", default=Din)`` that keeps the ~7 single-param
# ``LinearOperator[V]`` subscript sites meaning ``[V, V]`` needs native
# ``typing.TypeVar(default=…)`` (3.13+), avoiding a ``typing_extensions``
# dependency. Runtime is already 3.14; this drops 3.11/3.12 support.
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.14",
    "matplotlib>=3.8",
    "pyXSteam>=0.4",
    "h5py>=3.9",
    "pint>=0.20",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    # The SN suite OOMs when run as ONE single-process invocation (1378
    # tests, many materialize dense operators). The memory-safe default
    # is PER CAPABILITY TIER (see .claude/plans/sn_test_taxonomy.md):
    # each tier dir runs single-process fast + light (e.g. operators =
    # 395 tests / 3s / 186 MB), and `pytest -m sentinel` is the
    # seconds-fast always-on gate (run sentinels WITHOUT -O — vv Mode 8:
    # -O strips bare asserts in non-rewritten helpers). NO whole-tree
    # single-process run.
    #
    # xdist pin: 3.8.0 DEADLOCKS the scheduler on Python 3.14.3 (workers
    # exit, master idles at 0% CPU; reproduces at -n 2). 3.7.0 WORKS
    # (operators tier -n4 = 4s, exit 0) — hence the <3.8 cap. NOTE: even
    # on 3.7, `tests/sn -n auto` over the WHOLE suite uses ~21 GB
    # aggregate RSS (per-worker bounded, but summed) and is slow (the
    # inherent convergence/MMS tests dominate) — prefer per-tier, and use
    # `-n` to parallelize WITHIN a tier or in CI where the RAM is there.
    "pytest-xdist>=3,<3.8",
    # Per-test timeout — REQUIRED by the mutation-testing harness: an
    # injected mutant can cause an infinite loop, so each mutated run
    # must be time-bounded. Inert without `--timeout`.
    "pytest-timeout>=2",
    # Mutation-testing engine for the sentinel sensitivity metric. Runs
    # on Python 3.14.3 via the `local` distributor (NO xdist). Scopes to
    # ONE module-under-test per config so per-capability runs stay
    # tractable (~1 s/mutant). See tests/_mutation/README.md (Phase S0
    # verdict: cosmic-ray over mutmut). diamond.py spike: 99.7 % score.
    "cosmic-ray>=8.4",
    "sympy>=1.13",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme",
    "sphinxcontrib-nexus>=0.3",
    "sympy>=1.13",
]
dev = [
    "orpheus[test,docs]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Modern importlib-based discovery. Required once tests/ grew to a
# nested layout (``tests/sn/``, ``tests/cp/``, ...) because several
# subfolders share basenames (e.g. ``test_properties.py`` exists in
# cp/, sn/, mc/, moc/, diffusion/, moc/). The legacy ``prepend``
# import mode would import each as the same top-level module name
# and raise "import file mismatch" on collection. Passed via
# ``addopts`` because the ``importmode`` key is not a recognised
# pytest ini option — only the CLI flag form is supported.
addopts = "--import-mode=importlib"
markers = [
    "slow: long-running tests (MC, full convergence studies)",
    "l0: L0 Term Verification — hand calc vs code, per term (synthetic XS)",
    "l1: L1 Equation Verification — analytical/MMS, asserts convergence order",
    "l2: L2 Integration — multi-group heterogeneous, self-convergence",
    "l3: L3 Validation — comparison against experiment (ICSBEP, IRPhE)",
    "foundation: Foundation — software invariant (data structure / numerical primitive), not a physics equation",
    "verifies(*labels): Sphinx equation labels (:label: in docs/theory/*.rst) that this test exercises",
    "catches(*tags): failure-mode (FM-NN) or error-catalog (ERR-NNN) tags this test guards",
    "regression: Frozen-reference snapshot tests gating numerical drift across refactors (NOT a verification reference — see tests/sn/regression/_generate_snapshots.py)",
    "cap(name): SN capability-taxonomy tier the test exercises (orthogonal to l0/l1/l2/foundation). Names from the capability DAG in .claude/plans/sn_test_taxonomy.md: primitives, operators, sweep_core, sweep_slab, sweep_curvilinear, sweep_cartesian_2d, solve, eigenvalue, verification_mms, verification_analytical.",
    "sentinel: SN canary regression tripwire — a CHEAP, sharply-sensitive test selected so `pytest -m sentinel` runs in seconds and a single flip localizes the blast radius via its cap() label + the capability DAG. Mutation-adequate fast net (NOT proof; the full per-tier suite is the deep net). One sentinel per capability node. See .claude/plans/sn_sentinel_harness.md.",
]

[tool.setuptools.packages.find]
include = ["orpheus*"]

[tool.pyright]
# Resolve third-party imports (numpy/scipy/h5py/...) from the project venv
# so the LSP/type-checker diagnostics are accurate. Repo-root-relative, so it
# works locally and in the cloud once the setup creates ``.venv``.
venvPath = "."
venv = ".venv"
# Pin the analysis target to the new floor (requires-python ">=3.13") so the
# CLI oracle (#226) evaluates PEP-696 TypeVar defaults natively — without a
# pin pyright infers 3.13 from requires-python's lower bound, but pinning
# makes the two-param-split (#65) target explicit and stable.
pythonVersion = "3.13"
