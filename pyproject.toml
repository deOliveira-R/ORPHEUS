[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orpheus"
version = "0.1.0"
description = "Open Reactor Physics Educational University System"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.14",
    "matplotlib>=3.8",
    "pyXSteam>=0.4",
    "h5py>=3.9",
    "pint>=0.20",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    # The SN suite OOMs when run as ONE single-process invocation (1378
    # tests, many materialize dense operators). The memory-safe default
    # is now PER CAPABILITY TIER (see .claude/plans/sn_test_taxonomy.md):
    # each tier dir runs single-process fast + light (e.g. operators =
    # 395 tests / 3s / 186 MB), and `pytest -m sentinel` is the
    # seconds-fast always-on gate. NO whole-tree single-process run.
    #
    # pytest-xdist would parallelize, BUT 3.8.0 DEADLOCKS the scheduler
    # on Python 3.14.3 (workers exit, master idles at 0% CPU; reproduces
    # at -n 2 and on a single slow file). Until that's fixed, do NOT use
    # `-n` for the suite; pin <3.8 if you must parallelize. Kept declared
    # because the mutation-testing harness (per-capability) will want
    # parallelism once a working xdist/Py combo exists.
    "pytest-xdist>=3",
    # Per-test timeout — REQUIRED by the mutation-testing harness: an
    # injected mutant can cause an infinite loop, so each mutated run
    # must be time-bounded. Inert without `--timeout`.
    "pytest-timeout>=2",
    "sympy>=1.13",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme",
    "sphinxcontrib-nexus>=0.3",
    "sympy>=1.13",
]
dev = [
    "orpheus[test,docs]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Modern importlib-based discovery. Required once tests/ grew to a
# nested layout (``tests/sn/``, ``tests/cp/``, ...) because several
# subfolders share basenames (e.g. ``test_properties.py`` exists in
# cp/, sn/, mc/, moc/, diffusion/, moc/). The legacy ``prepend``
# import mode would import each as the same top-level module name
# and raise "import file mismatch" on collection. Passed via
# ``addopts`` because the ``importmode`` key is not a recognised
# pytest ini option — only the CLI flag form is supported.
addopts = "--import-mode=importlib"
markers = [
    "slow: long-running tests (MC, full convergence studies)",
    "l0: L0 Term Verification — hand calc vs code, per term (synthetic XS)",
    "l1: L1 Equation Verification — analytical/MMS, asserts convergence order",
    "l2: L2 Integration — multi-group heterogeneous, self-convergence",
    "l3: L3 Validation — comparison against experiment (ICSBEP, IRPhE)",
    "foundation: Foundation — software invariant (data structure / numerical primitive), not a physics equation",
    "verifies(*labels): Sphinx equation labels (:label: in docs/theory/*.rst) that this test exercises",
    "catches(*tags): failure-mode (FM-NN) or error-catalog (ERR-NNN) tags this test guards",
    "regression: Frozen-reference snapshot tests gating numerical drift across refactors (NOT a verification reference — see tests/sn/regression/_generate_snapshots.py)",
    "cap(name): SN capability-taxonomy tier the test exercises (orthogonal to l0/l1/l2/foundation). Names from the capability DAG in .claude/plans/sn_test_taxonomy.md: primitives, operators, sweep_core, sweep_slab, sweep_curvilinear, sweep_cartesian_2d, solve, eigenvalue, verification_mms, verification_analytical.",
]

[tool.setuptools.packages.find]
include = ["orpheus*"]
