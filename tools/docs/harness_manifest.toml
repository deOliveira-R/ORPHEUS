# What `tools/docs/generate_harness.py` generates, from where, under what budget.
#
# The docs are the source; `.claude/` is one harness's generated view of them
# (plan harness_context_budget.md, ruling 2026-09-19: "the flow is from docs
# to .claude, never the opposite"). Every target below is committed, so the
# harness reads it without a build; `tests/test_harness_generated.py` runs `--check`
# in the canonical pytest gate and fails on drift.
#
# budget_tokens counts tokens as the generator estimates them (CHARS_PER_TOKEN in
# generate_harness.py): the always-on cost every dispatch pays for a rule or an
# agent's role block, the per-load cost for a skill. Exceeding it fails generation.
#
# How a budget is set: a round figure above the measured size after a review
# pass, never more than SLACK_MAX (generate_harness.py) tokens above it — the
# generator fails on more slack, so an over-generous budget cannot let growth
# in unreviewed; an agent's role block takes one flat value per role (Key 500,
# Support 300) inside the same slack. A raise is made in the same commit as the
# text that needs it. The budget is a size gate, never a quality gate: the
# review is.

[[rule]]
source = "docs/development/rules/plan-authoring.md"
target = ".claude/rules/plan-authoring.md"
budget_tokens = 9600

[[rule]]
source = "docs/development/rules/coding-standards.md"
target = ".claude/rules/coding-standards.md"
budget_tokens = 5300

