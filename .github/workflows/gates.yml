# The cheap, deterministic half of the project's acceptance, on every push and
# pull request. The full pytest suite stays local: it is serial and takes over
# ninety minutes per tier. What each step reads, and how a session reads the
# run after a push, is docs/development/git_workflow.rst, "Continuous
# integration". The venv is created at `.venv` because pyproject.toml's
# [tool.pyright] names it, so pyright here reads the same configuration as
# pyright on a developer's machine.
name: gates

on:
  push:
  pull_request:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install into .venv, the venv pyproject.toml's [tool.pyright] names
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
      - name: The harness view is generated and current
        run: .venv/bin/python -m tools.harness --check
      - name: The generator, the generated tree, the layer contract and the text ledgers, under -O
        run: .venv/bin/python -O -m pytest tests/gates/tools/test_harness_generator.py tests/gates/tools/test_write_guards.py tests/gates/test_harness_generated.py tests/gates/test_layer_imports.py tests/gates/test_concept_table.py tests/gates/test_concept_table_machinery.py tests/gates/test_concept_table_page.py tests/gates/geometry/test_axis_table.py tests/gates/test_error_catalogue_reconciles.py tests/gates/test_elegance_debt_is_tagged.py tests/gates/test_vv_harness_audit.py -q
      # The platform-independence witness (2026-10-01): a macOS update moved
      # the Gauss rules by 1-2 ULP when they were the platform eigen-solver's
      # output. They are now correctly rounded, and the fingerprint gate pins
      # their bytes, so the same frozen digests must hold on this Linux /
      # OpenBLAS runner as on the macOS / Accelerate host. ~15 s.
      - name: The Gauss rules are correctly rounded, with the same bytes on this platform, under -O
        run: .venv/bin/python -O -m pytest tests/gates/numerics/test_gauss_rule_fingerprint.py tests/gates/numerics/test_gauss_rules_correctly_rounded.py tests/gates/numerics/test_generating_measure.py -q
      # The content digests (#405 P1 step 5, 2026-10-02): every persistent
      # cache key is a digest of a specification's content, so the same
      # value must digest to the same bytes on every platform. The suite's
      # RECORD row pins three digests on the macOS host; the seed-stability
      # row spawns two interpreters. ~5 s.
      - name: The content digests are the same bytes on this platform, under -O
        run: .venv/bin/python -O -m pytest tests/gates/values/test_content_identity.py tests/gates/values/test_digest_convention.py tests/gates/test_content_identity_census.py tests/gates/numerics/test_content_identity_axis.py tests/gates/data/test_content_identity_data.py tests/gates/geometry/test_content_identity_geometry.py tests/gates/mesh/test_content_identity_mesh.py -q
      # The gates of the space algebra (the ontology chart's wave W1), unit by
      # unit; each unit adds its files here in the commit that lands them. Every
      # file listed compares a computation with a computation, or reads a parse
      # tree or an integer index set, so it reads the same on this platform.
      # NOT listed, by design: tests/gates/cross_method/w1/test_snapshot_harness.py,
      # test_dense_inverse_bytes.py and test_axis_form_bytes.py, which compare bytes stored on the
      # macOS arm64 host (Accelerate) and fail on any other host stamp.
      - name: The space algebra gates (W1), under -O
        run: .venv/bin/python -O -m pytest tests/gates/cross_method/w1/test_snapshot_controls.py tests/gates/numerics/w1/test_form_equality.py tests/gates/numerics/w1/test_content_identity_metric.py tests/gates/numerics/w1/test_bare_path_takes_the_matrix_as_stored.py tests/gates/numerics/w1/test_content_identity_declaration.py tests/gates/numerics/w1/test_declaration_normal_form.py tests/gates/numerics/w1/test_dense_inverse_admission.py tests/gates/numerics/w1/test_dense_kernel_declared.py tests/gates/numerics/w1/test_no_cutoff_in_metric.py tests/gates/numerics/w1/test_signature_guarantee.py tests/gates/numerics/w1/test_half_range_one_owner.py tests/gates/numerics/w1/test_half_range_population.py tests/gates/numerics/w1/test_no_cutoff_symbols.py tests/gates/numerics/w1/test_trace_half_range_coherence.py tests/gates/mesh/w1/test_half_range_selectors.py tests/gates/sn/primitives/test_degenerate_ordinate_reads_the_owner.py tests/gates/numerics/w1/test_factor_klein.py tests/gates/numerics/w1/test_factor_energy_law.py tests/gates/numerics/w1/test_factor_singular_face.py tests/gates/numerics/w1/test_factor_induced_form.py tests/gates/numerics/w1/test_variance_literal.py tests/gates/numerics/w1/test_axis_form_derived.py tests/gates/numerics/w1/test_form_kernel_signature.py tests/gates/numerics/w1/test_axis_reader_mapping.py tests/gates/numerics/w1/test_dense_form_stated_face.py tests/gates/numerics/w1/test_frame_measure_sign.py tests/gates/numerics/w1/test_content_identity_factor.py tests/gates/numerics/w1/test_factor_dense_admission_table.py tests/gates/numerics/w1/test_invertible_form.py tests/gates/cross_method/w1/test_signed_rule_reflective.py tests/gates/cross_method/w1/test_signed_rule_is_a_legal_factor.py tests/gates/numerics/w1/test_allow_list_is_the_pinned_set.py tests/gates/numerics/w1/test_declared_requires_a_variance.py tests/gates/numerics/w1/test_flat_in_slot_order.py tests/gates/numerics/w1/test_leaf_branches_are_pinned.py tests/gates/numerics/w1/test_mixed_kind_slots.py tests/gates/numerics/w1/test_no_axes_arm_and_no_overlay.py tests/gates/numerics/w1/test_one_spelling_of_the_contraction.py tests/gates/numerics/w1/test_one_tensor_type.py tests/gates/numerics/w1/test_retraction_reads_the_factor.py tests/gates/numerics/w1/test_tensor_legality.py tests/gates/numerics/w1/test_tensor_space_constructors.py tests/gates/numerics/w1/test_tensor_space_klein.py tests/gates/numerics/w1/test_test_space_is_basis_space.py tests/gates/cross_method/w1/test_production_variance.py tests/gates/numerics/test_frame.py tests/gates/numerics/test_spherical_harmonic_space.py -q
      # The tapes (orpheus/data/micro_xs/*.GXS, 13 files, 411 MB) are the
      # repository's Git LFS objects; the checkout above leaves their pointer
      # files, whose text carries each tape's object id, so hashing them keys
      # the cache on the tapes' content without fetching a byte. The built
      # store is what the build reads; a miss pulls the tapes and the loader
      # converts each isotope the build touches on first use.
      - name: The HDF5 cross-section store, cached on the tapes' object ids and the store's sources
        id: store
        uses: actions/cache@v4
        with:
          path: orpheus/data/micro_xs/*.h5
          key: micro-xs-h5-${{ hashFiles('orpheus/data/micro_xs/*.GXS', 'orpheus/data/micro_xs/gendf.py', 'orpheus/data/micro_xs/hdf5_io.py', 'orpheus/data/micro_xs/isotope.py', 'orpheus/data/micro_xs/convert_gxs_to_hdf5.py') }}
      - name: On a store miss, fetch the tapes from LFS; the build then materialises the store
        if: steps.store.outputs.cache-hit != 'true'
        run: git lfs pull --include="orpheus/data/micro_xs/*.GXS"
      - name: "pyright as the #226 ratchet over orpheus/: tests/gates/test_pyright_ratchet.py against the committed baseline"
        run: |
          npm install -g pyright@1.1.410
          .venv/bin/python -O -m pytest tests/gates/test_pyright_ratchet.py -q
      - name: Sphinx, strict; rebuilds every generated file and the Nexus graph
        run: .venv/bin/sphinx-build -E -W --keep-going docs docs/_build/html
      - name: The build changed no tracked file
        run: git diff --exit-code --stat
