# The cheap, deterministic half of the project's acceptance, on every push and
# pull request. The full pytest suite stays local: it is serial and takes over
# ninety minutes per tier. What each step reads, and how a session reads the
# run after a push, is docs/development/git_workflow.rst, "Continuous
# integration". The venv is created at `.venv` because pyproject.toml's
# [tool.pyright] names it, so pyright here reads the same configuration as
# pyright on a developer's machine.
name: gates

on:
  push:
  pull_request:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install into .venv, the venv pyproject.toml's [tool.pyright] names
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
      - name: The harness view is generated and current
        run: .venv/bin/python -m tools.harness --check
      - name: The generator, the generated tree, the layer contract and the text ledgers, under -O
        run: .venv/bin/python -O -m pytest tests/gates/tools/test_harness_generator.py tests/gates/tools/test_write_guards.py tests/gates/test_harness_generated.py tests/gates/test_layer_imports.py tests/gates/test_error_catalogue_reconciles.py tests/gates/test_elegance_debt_is_tagged.py tests/gates/test_vv_harness_audit.py -q
      # The tapes (orpheus/data/micro_xs/*.GXS, 13 files, 411 MB) are the
      # repository's Git LFS objects; the checkout above leaves their pointer
      # files, whose text carries each tape's object id, so hashing them keys
      # the cache on the tapes' content without fetching a byte. The built
      # store is what the build reads; a miss pulls the tapes and the loader
      # converts each isotope the build touches on first use.
      - name: The HDF5 cross-section store, cached on the tapes' object ids and the store's sources
        id: store
        uses: actions/cache@v4
        with:
          path: orpheus/data/micro_xs/*.h5
          key: micro-xs-h5-${{ hashFiles('orpheus/data/micro_xs/*.GXS', 'orpheus/data/micro_xs/gendf.py', 'orpheus/data/micro_xs/hdf5_io.py', 'orpheus/data/micro_xs/isotope.py', 'orpheus/data/micro_xs/convert_gxs_to_hdf5.py') }}
      - name: On a store miss, fetch the tapes from LFS; the build then materialises the store
        if: steps.store.outputs.cache-hit != 'true'
        run: git lfs pull --include="orpheus/data/micro_xs/*.GXS"
      - name: "pyright as the #226 ratchet over orpheus/: tests/gates/test_pyright_ratchet.py against the committed baseline"
        run: |
          npm install -g pyright@1.1.410
          .venv/bin/python -O -m pytest tests/gates/test_pyright_ratchet.py -q
      - name: Sphinx, strict; rebuilds every generated file and the Nexus graph
        run: .venv/bin/sphinx-build -E -W --keep-going docs docs/_build/html
      - name: The build changed no tracked file
        run: git diff --exit-code --stat
